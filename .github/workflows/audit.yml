name: Security & License Audit

on:
  schedule:
    - cron: "0 0 * * 1"
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:

jobs:
  audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pirafrank/audit-check-action@v1

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
