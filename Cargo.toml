[package]
name = "pressflow"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

[workspace]
members = ["crates/core", "crates/wayland", "crates/x11"]

[workspace.package]
edition = "2024"
license = "GPLv3"
authors = ["mintori"]

[profile.dev]
incremental = true
codegen-units = 16
debug = "limited"

[profile.dev.build-override]
codegen-units = 16
debug = "limited"

[profile.dev.package]
toml = { opt-level = 3 }
smithay-client-toolkit = { opt-level = 3 }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
debug = "limited"

[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
strip = "none"
debug = "full"

[dependencies]
arc-swap = "1.9.5"
clap = { version = "4.6.9", features = ["derive", "help", "usage"] }
error-context = "0.1.2"
indexmap = { version = "2.14.2", features = ["serde"] }
notify = "9.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
slint = { version = "1.13.1", features = [
  "backend-winit",
  "renderer-software",
] }
tokio = { version = "1.54.1", features = ["full"] }
toml = { version = "1.2.2", features = ["preserve_order"] }
